apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: jet-meal
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE__URL
              valueFrom:
                configMapKeyRef:
                  name: user-service-config
                  key: database.url
            - name: SERVER__PORT
              valueFrom:
                configMapKeyRef:
                  name: user-service-config
                  key: server.port
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
