apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-postgres-pvc
  namespace: jet-meal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 0.5Gi

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: user-postgres-db
  namespace: jet-meal
spec:
  serviceName: user-postgres-db
  replicas: 1
  selector:
    matchLabels:
      app: user-postgres-db
  template:
    metadata:
      labels:
        app: user-postgres-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: user_service_db
            - name: POSTGRES_USER
              value: user
            - name: POSTGRES_PASSWORD
              value: password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: user-postgres-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: user-postgres-db
  namespace: jet-meal
spec:
  selector:
    app: user-postgres-db
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
