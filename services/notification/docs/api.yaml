openapi: 3.0.3
info:
  title: Notification Service API
  version: 0.1.0
  description: |
    HTTP API for the notification microservice: health checks, Kafka consumer stats,
    and CRUD for user notifications stored in MongoDB.

    Interactive docs are served by the app at `/docs` and machine-readable schema at `/openapi.json`.
    This file is the checked-in contract; keep it aligned with `app/main.py` and `app/schemas.py`.

servers:
  - url: http://localhost:8081
    description: Docker Compose (host port mapped to container 8080)
  - url: http://localhost:8080
    description: Direct run inside container or local uvicorn without port mapping

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Operations
    description: Kafka consumer diagnostics
  - name: Notifications
    description: User notification CRUD

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: liveness
      responses:
        "200":
          description: Service process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      operationId: readiness
      responses:
        "200":
          description: Dependencies status (MongoDB + Kafka consumer thread)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /stats:
    get:
      tags: [Operations]
      summary: Kafka consumer statistics
      operationId: consumerStats
      responses:
        "200":
          description: Current consumer counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerState"

  /notifications:
    post:
      tags: [Notifications]
      summary: Create notification (API path)
      operationId: createNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationCreate"
      responses:
        "201":
          description: Notification created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationOut"
        "409":
          description: Duplicate event_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "422":
          description: Validation error

  /notifications/{notification_id}:
    get:
      tags: [Notifications]
      summary: Get notification by id
      operationId: getNotification
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: Notification found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationOut"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
    patch:
      tags: [Notifications]
      summary: Update notification
      operationId: updateNotification
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationUpdate"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationOut"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "422":
          description: Validation error
    delete:
      tags: [Notifications]
      summary: Delete notification
      operationId: deleteNotification
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /users/{user_id}/notifications:
    get:
      tags: [Notifications]
      summary: List notifications for a user
      operationId: listUserNotifications
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Paginated list (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationOut"
        "422":
          description: Invalid query parameters

components:
  parameters:
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
        description: MongoDB ObjectId as hex string

  schemas:
    LivenessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ConsumerState:
      type: object
      required: [running, processed_messages, failed_messages]
      properties:
        running:
          type: boolean
        processed_messages:
          type: integer
        failed_messages:
          type: integer
        last_error:
          type: string
          nullable: true

    ReadinessResponse:
      type: object
      required: [status, mongo_ok, consumer]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        mongo_ok:
          type: boolean
        consumer:
          $ref: "#/components/schemas/ConsumerState"

    NotificationCreate:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          minLength: 1
        title:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        channel:
          type: string
          nullable: true
        context:
          type: object
          additionalProperties: true
          nullable: true
        event_id:
          type: string
          nullable: true

    NotificationUpdate:
      type: object
      properties:
        title:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        channel:
          type: string
          nullable: true
        context:
          type: object
          additionalProperties: true
          nullable: true
        read:
          type: boolean
          nullable: true

    NotificationOut:
      type: object
      required:
        - id
        - user_id
        - context
        - read
        - created_at
        - updated_at
      properties:
        id:
          type: string
        user_id:
          type: string
        title:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        channel:
          type: string
          nullable: true
        context:
          type: object
          additionalProperties: true
        read:
          type: boolean
        event_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        source:
          type: string
          nullable: true
          description: e.g. api or kafka

    ErrorDetail:
      type: object
      properties:
        detail:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
