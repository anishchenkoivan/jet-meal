version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: delivery-postgres
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
    ports:
      - "5432:5432"
    volumes:
      - delivery-postgres-data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: delivery-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: delivery-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  delivery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-service
    depends_on:
      - postgres
      - kafka
    ports:
      - "8080:8080"
    environment:
      DELIVERY_DB_URL: jdbc:postgresql://postgres:5432/delivery
      DELIVERY_DB_USERNAME: delivery
      DELIVERY_DB_PASSWORD: delivery
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DELIVERY_KAFKA_GROUP_ID: delivery-service

volumes:
  delivery-postgres-data:
