name: Frontend

on:
  push:
    branches: [main]
    paths: [frontend/**]
  pull_request:
    paths: [frontend/**]

defaults:
  run:
    working-directory: frontend

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.27.0"

jobs:
  # ── lint + type check ───────────────────────────────────────────────────────
  check:
    name: Lint & TSC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Biome
        run: pnpm biome check .

      - name: TypeScript
        run: pnpm tsc

  # ── unit tests ──────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Vitest
        run: pnpm --filter @jet-meal/restaurant-ssr unit

  # ── storybook ───────────────────────────────────────────────────────────────
  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Storybook
        run: pnpm --filter @jet-meal/restaurant-ssr storybook:build

      # TODO: replace with actual upload to your storage (S3, GCS, etc.)
      - name: Upload Storybook (placeholder)
        run: echo "Upload storybook-static/ to storage — not configured yet"

  # ── docker build ────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [check, test]
    strategy:
      matrix:
        service: [auth-ssr, delivery-ssr, restaurant-ssr]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # TODO: add docker/login-action when registry is configured
      # - uses: docker/login-action@v3
      #   with:
      #     registry: ${{ vars.REGISTRY }}
      #     username: ${{ secrets.REGISTRY_USER }}
      #     password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: false  # set to true once registry vars are configured
          tags: jet-meal/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
