name: Run tests for delivery service

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'services/delivery/**'
  push:
    branches: [ main ]
    paths:
      - 'services/delivery/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run tests
        run: ./gradlew test
        working-directory: services/delivery
