name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      component:
        type: choice
        description: 'Select component to deploy'
        required: true
        options:
          - all
          - monitoring
          - s3
          - kafka
          - frontend

jobs:
  notify-start:
    name: Send start notification
    runs-on: ubuntu-latest
    
    steps:
      - name: Send notification
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          parse-mode: html
          message: |
            <b>🚀 Infrastructure deployment started: ${{ github.event.inputs.component }}</b>

            🔗 <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View Workflow</a>

  deploy:
    name: Deploy ${{ github.event.inputs.component }}
    runs-on: ubuntu-latest
    needs: notify-start

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat > ~/.ssh/config << EOF
          Host deploy-server
            HostName ${{ secrets.HOST }}
            Port ${{ secrets.SSH_PORT }}
            User ${{ vars.USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Update repo on machine
        run: |
          ssh deploy-server << 'EOF'
            cd ~/jet-meal
            git pull
          EOF

      - name: Deploy monitoring
        if: github.event.inputs.component == 'all' || github.event.inputs.component == 'monitoring'
        run: |
          ssh deploy-server << 'EOF'
            cd ~/jet-meal
            kubectl apply -k deploy/monitoring/
          EOF

      - name: Deploy S3
        if: github.event.inputs.component == 'all' || github.event.inputs.component == 's3'
        run: |
          ssh deploy-server << 'EOF'
            cd ~/jet-meal
            kubectl apply -k deploy/s3/
          EOF

      - name: Deploy Kafka
        if: github.event.inputs.component == 'all' || github.event.inputs.component == 'kafka'
        run: |
          ssh deploy-server << 'EOF'
            cd ~/jet-meal
            kubectl apply -k deploy/kafka/
          EOF

      - name: Deploy Frontend
        if: github.event.inputs.component == 'all' || github.event.inputs.component == 'frontend'
        run: |
          ssh deploy-server << 'EOF'
            cd ~/jet-meal
            kubectl apply -f frontend/k8s/auth-ssr.yaml
            kubectl apply -f frontend/k8s/delivery-ssr.yaml
            kubectl apply -f frontend/k8s/restaurant-ssr.yaml
            kubectl apply -f frontend/k8s/ingress.yaml
          EOF

      - name: Verify deployment
        run: |
          ssh deploy-server << 'EOF'
            echo "=== Monitoring namespace ==="
            kubectl get pods -n monitoring
            echo ""
            echo "=== S3 namespace ==="
            kubectl get pods -n s3
            echo ""
            echo "=== Kafka namespace ==="
            kubectl get pods -n kafka
          EOF

  notify-success:
    name: Send success notification
    runs-on: ubuntu-latest
    needs: 
      - deploy
    if: always() && needs.deploy.result == 'success'

    steps:
      - name: Send success notification
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          parse-mode: html
          message: |
            <b>✅ Infrastructure deployment completed: ${{ github.event.inputs.component }}</b>

            🔗 <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View Workflow</a>

  notify-failure:
    name: Send failure notification
    runs-on: ubuntu-latest
    needs: 
      - deploy
    if: always() && needs.deploy.result == 'failure'

    steps:
      - name: Send failure notification
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          parse-mode: html
          message: |
            <b>❌ Infrastructure deployment failed: ${{ github.event.inputs.component }}</b>

            🔗 <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View Workflow</a>
