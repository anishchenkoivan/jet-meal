name: Deploy All Services

on:
  workflow_dispatch:

jobs:
  notify-start:
    name: Send start notification
    runs-on: ubuntu-latest
    
    steps:
      - name: Send notification
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          parse-mode: html
          message: |
            <b>🚀 Full deployment started</b>

            🔗 <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View Workflow</a>

  build:
    name: Build all services
    runs-on: ubuntu-latest
    needs: notify-start

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat > ~/.ssh/config << EOF
          Host deploy-server
            HostName ${{ secrets.HOST }}
            Port ${{ secrets.SSH_PORT }}
            User ${{ vars.USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Update repo on machine
        run: |
          ssh deploy-server << 'EOF'
            cd ~/jet-meal
            git pull
          EOF

      - name: Build all services
        run: |
          ssh deploy-server << 'EOF'
            cd ~/jet-meal
            
            echo "Building businesses..."
            docker build -t businesses-service:latest -f services/businesses/Dockerfile .
            
            echo "Building billing..."
            docker build -t billing-service:latest -f services/billing/Dockerfile .
            
            echo "Building order..."
            docker build -t order-service:latest -f services/order/Dockerfile .
            
            echo "Building user_service..."
            docker build -t user-service:latest -f services/user_service/Dockerfile .
            
            echo "Building shdb..."
            docker build -t shdb-service:latest -f services/shdb/Dockerfile .
            
            echo "Building frontend services..."
            for SERVICE in auth-ssr delivery-ssr restaurant-ssr; do
              docker build --build-arg SERVICE_NAME=$SERVICE -t $SERVICE:latest -f frontend/Dockerfile frontend/
            done
          EOF

  deploy-services:
    name: Deploy services
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy all services
        run: |
          ssh deploy-server << 'EOF'
            cd ~/jet-meal
            
            echo "Deploying businesses..."
            kubectl apply -f services/businesses/k8s/
            
            echo "Deploying billing..."
            kubectl apply -f services/billing/k8s/
            
            echo "Deploying order..."
            kubectl apply -f services/order/k8s/
            
            echo "Deploying user_service..."
            kubectl apply -f services/user_service/k8s/
            
            echo "Deploying shdb..."
            kubectl apply -f services/shdb/k8s/
            
            echo "Deploying frontend..."
            kubectl apply -f frontend/k8s/auth-ssr.yaml
            kubectl apply -f frontend/k8s/delivery-ssr.yaml
            kubectl apply -f frontend/k8s/restaurant-ssr.yaml
            kubectl apply -f frontend/k8s/ingress.yaml
          EOF

  deploy-infrastructure:
    name: Deploy infrastructure
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy monitoring
        run: |
          ssh deploy-server << 'EOF'
            cd ~/jet-meal
            kubectl apply -k deploy/monitoring/
          EOF

      - name: Deploy S3
        run: |
          ssh deploy-server << 'EOF'
            cd ~/jet-meal
            kubectl apply -k deploy/s3/
          EOF

      - name: Deploy Kafka
        run: |
          ssh deploy-server << 'EOF'
            cd ~/jet-meal
            kubectl apply -k deploy/kafka/
          EOF

      - name: Deploy Redis
        run: |
          ssh deploy-server << 'EOF'
            cd ~/jet-meal
            kubectl apply -k deploy/redis/
          EOF

  verify:
    name: Verify deployment
    runs-on: ubuntu-latest
    needs: 
      - deploy-services
      - deploy-infrastructure

    steps:
      - name: Check pods status
        run: |
          ssh deploy-server << 'EOF'
            echo "=== jet-meal namespace ==="
            kubectl get pods -n jet-meal
            echo ""
            echo "=== monitoring namespace ==="
            kubectl get pods -n monitoring
            echo ""
            echo "=== s3 namespace ==="
            kubectl get pods -n s3
            echo ""
            echo "=== kafka namespace ==="
            kubectl get pods -n kafka
            echo ""
            echo "=== redis ==="
            kubectl get pods -n jet-meal | grep redis
            echo ""
            echo "=== Services ==="
            kubectl get svc -n jet-meal
          EOF

  notify-success:
    name: Send success notification
    runs-on: ubuntu-latest
    needs: 
      - verify
    if: always() && needs.verify.result == 'success'

    steps:
      - name: Send success notification
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          parse-mode: html
          message: |
            <b>✅ Full deployment completed successfully</b>

            🔗 <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View Workflow</a>

  notify-failure:
    name: Send failure notification
    runs-on: ubuntu-latest
    needs: 
      - verify
    if: always() && needs.verify.result == 'failure'

    steps:
      - name: Send failure notification
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          parse-mode: html
          message: |
            <b>❌ Full deployment failed</b>

            🔗 <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View Workflow</a>
