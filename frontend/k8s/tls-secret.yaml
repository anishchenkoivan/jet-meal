apiVersion: v1
kind: Secret
metadata:
  name: jet-meal-tls
  namespace: frontend
type: kubernetes.io/tls
data:
  # Generate with:
  # kubectl create secret tls jet-meal-tls --cert=path/to/cert.crt --key=path/to/cert.key -n frontend
  # Or use cert-manager for automatic certificate management
  tls.crt: REPLACE_WITH_BASE64_CERT
  tls.key: REPLACE_WITH_BASE64_KEY
