apiVersion: v1
kind: ConfigMap
metadata:
  name: restaurant-ssr-config
  namespace: frontend
data:
  NEXT_PUBLIC_API_URL: "http://businesses-service.jet-meal.svc.cluster.local"
  NODE_ENV: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-ssr
  namespace: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: restaurant-ssr
  template:
    metadata:
      labels:
        app: restaurant-ssr
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      containers:
        - name: restaurant-ssr
          image: restaurant-ssr:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: restaurant-ssr-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-ssr
  namespace: frontend
spec:
  selector:
    app: restaurant-ssr
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
